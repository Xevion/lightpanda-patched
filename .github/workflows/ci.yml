name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-tool:
    name: patch tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Upstream is checked out at the workspace root for two reasons: it lets
      # setup-zig resolve the same `minimum_zig_version` the patch is compiled
      # against in the release build, and it gives the drift check below real
      # source to run against. Only the tip is needed, so no fetch-depth.
      - name: checkout lightpanda-io/browser
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: lightpanda-io/browser
          ref: main

      - name: checkout this repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: _patched

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: zig fmt
        run: zig fmt --check _patched/tools

      - name: patch tool tests
        run: zig test _patched/tools/patch/patch.zig

      # The cheap upstream-drift signal: no V8, no build, ~1s. A failure here
      # means the patch no longer matches upstream main, hours before the
      # nightly build would have told us.
      - name: patch still applies to upstream main
        run: zig run _patched/tools/patch/main.zig -- --check .
