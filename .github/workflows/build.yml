name: build

# The nightly channel: tracks upstream main. Mirrored upstream releases are
# handled separately by mirror-tags.yml; both call release-build.yml.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [master]
    # A change to the patch tool changes the binary even when upstream hasn't
    # moved, so it earns a rebuild the same way a new upstream commit does.
    paths:
      - "tools/patch/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release-build.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref or SHA to build"
        required: false
        default: "main"
      force:
        description: "Build even if this commit was already built"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: resolve the upstream commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/lightpanda-io/browser/commits/$REF" --jq .sha)
          date=$(gh api "repos/lightpanda-io/browser/commits/$sha" --jq .commit.committer.date | cut -dT -f1)
          {
            echo "sha=$sha"
            # Date-first so the release list sorts chronologically on its own.
            echo "tag=build-$date-${sha:0:9}"
          } >> "$GITHUB_OUTPUT"

      # A build is identified by (upstream commit, patch tool commit). Keying
      # on the upstream SHA alone would leave a published binary that no longer
      # matches the tool that claims to have produced it.
      - name: decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          PATCHER_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          should_build=true
          reason="no previous build recorded"

          if gh release download nightly --repo "$GITHUB_REPOSITORY" --pattern build-info.json --dir prev; then
            prev_upstream=$(jq -r .upstream_sha prev/build-info.json)
            prev_patcher=$(jq -r .patcher_sha prev/build-info.json)
            if [ "$prev_upstream" != "$UPSTREAM_SHA" ]; then
              reason="upstream moved: ${prev_upstream:0:9} -> ${UPSTREAM_SHA:0:9}"
            elif [ "$prev_patcher" != "$PATCHER_SHA" ]; then
              reason="patch tool changed: ${prev_patcher:0:9} -> ${PATCHER_SHA:0:9}"
            else
              should_build=false
              reason="already built from ${UPSTREAM_SHA:0:9} with ${PATCHER_SHA:0:9}"
            fi
          fi

          if [ "$FORCE" = "true" ]; then
            should_build=true
            reason="forced via workflow_dispatch"
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

  nightly:
    name: nightly
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/release-build.yml
    with:
      upstream_sha: ${{ needs.resolve.outputs.sha }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      version: nightly-patched
      channel: nightly
      rolling_tag: nightly
      make_latest: true
      prune: true
